# .readthedocs.yml
# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2.html for details

# Required
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.13"

# Build documentation in the docs/ directory with Sphinx. Warnings fail the
# build, as in the GitHub Pages workflow (.github/workflows/docs.yml).
sphinx:
  configuration: docs/source/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: requirements-doc.txt
