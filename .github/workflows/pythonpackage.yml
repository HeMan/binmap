name: Python package

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.12', '3.13', '3.14', '3.15']

    steps:
    - uses: actions/checkout@v7
    - name: Set up uv and Python ${{ matrix.python-version }}
      uses: astral-sh/setup-uv@v7
      with:
        python-version: ${{ matrix.python-version }}
        activate-environment: true
    - name: Install dependencies
      run: |
        uv pip install -r requirements-dev.txt
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        flake8 binmap tests --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        flake8 binmap tests --count --exit-zero --max-complexity=10 --statistics
    - name: Check with mypy
      run: |
        mypy --strict --disallow-any-explicit binmap tests/typecheck
    # pyright is the engine behind VS Code's Pylance: user code must type-check
    # there too. Pinned so a pyright release can't break CI unannounced.
    - name: Check with pyright
      run: |
        uvx pyright@1.1.414 binmap tests/typecheck

    - name: Test with pytest
      run: |
        python -m pytest -v
